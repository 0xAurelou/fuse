[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true

[profile.ci.fuzz]
runs = 1000

[profile.ci.invariant]
runs = 256
depth = 128

# Symbolic harnesses are separate from randomized tests.
[profile.formal]
test = "formal"
out = "out-formal"
cache_path = "cache/formal"
ast = true
extra_output = ["storageLayout", "metadata"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
