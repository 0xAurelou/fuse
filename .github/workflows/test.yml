name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

  formal:
    name: Symbolic verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: formal/requirements.txt

      - name: Install pinned verifier
        run: python -m pip install -r formal/requirements.txt

      - name: Check proof formatting and result gate
        run: |
          forge fmt --check formal
          python -m unittest discover -s scripts -p 'test_*.py'

      - name: Prove registered properties
        run: python scripts/verify_formal.py

      - name: Retain verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-verification-results
          path: formal-results/*.json
          if-no-files-found: ignore
